<!--
  TEMPLATE — app card for the home pages. See ADDING_AN_APP.md.
  Paste inside <div class="cards"> in /index.html (English) and /ja/index.html (Japanese).
  Japanese copy: link /ja/{{SLUG}}/, badge text "App Store で近日公開", "詳しく見る", -ja screenshot.
  Also add the app to the .hero-apps chip list and the footer "Velkmoor" list on both pages.
-->
      <!-- APP CARD: {{SLUG}} -->
      <article class="card t-{{SLUG}}">
        <div class="card-body">
          <picture><source srcset="/assets/img/{{SLUG}}/icon-512.webp" type="image/webp"><img class="app-icon" src="/assets/img/{{SLUG}}/icon-512.png" alt="" width="72" height="72"></picture>
          <h3>{{APP NAME}}</h3>
          <p class="kicker">{{KICKER}}</p>
          <p class="value">{{ONE-SENTENCE VALUE}}</p>
          <div class="actions">
            <!-- APP_STORE_LINK: when live, replace the <span> with the OFFICIAL Apple App Store badge artwork (Apple Marketing Tools) wrapped in <a href="https://apps.apple.com/app/idXXXXXXXXXX">. Do not restyle the badge. -->
            <span class="badge" data-app-store="{{SLUG}}">Coming soon on the App Store</span>
            <a class="more" href="/{{SLUG}}/">Learn more<span class="visually-hidden"> about {{APP NAME}}</span></a>
          </div>
        </div>
        <div class="card-shot" aria-hidden="true">
          <div class="phone"><picture><source srcset="/assets/img/{{SLUG}}/{{SHOT}}-en.webp" type="image/webp"><img src="/assets/img/{{SLUG}}/{{SHOT}}-en.jpg" alt="" width="720" height="1473" loading="lazy"></picture></div>
        </div>
      </article>
